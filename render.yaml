services:
  - type: web
    name: fishlensai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fishlensai-db
          property: connectionString

databases:
  - name: fishlensai-db
    plan: free
    databaseName: fishlensai
    user: fishlensai_user
